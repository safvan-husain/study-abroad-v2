name: study-abroad-production
services:
  spacetimedb:
    image: clockworklabs/spacetime:v2.0.3
    user: "0:0"
    entrypoint: ["/bin/sh", "/docker/spacetimedb-start.sh"]
    restart: unless-stopped
    volumes:
      - spacetimedb-advisor-data:/home/spacetime/data
      - spacetime-advisor-config:/home/spacetime/.config/spacetime
      - ./docker/spacetimedb-start.sh:/docker/spacetimedb-start.sh:ro
    healthcheck: { test: [CMD, /opt/spacetime/spacetimedb-cli, server, ping, http://localhost:3000], interval: 5s, timeout: 5s, retries: 30 }
    ports: ["3002:3000"]
  coordinator-publisher:
    image: clockworklabs/spacetime:v2.0.3
    depends_on: { spacetimedb: { condition: service_healthy } }
    build: { context: ., dockerfile: coordinator/Dockerfile }
    working_dir: /workspace
    volumes:
      - ./docker/coordinator-publish.sh:/docker/coordinator-publish.sh:ro
      - spacetime-advisor-config:/home/spacetime/.config/spacetime
    entrypoint: ["/bin/sh", "/docker/coordinator-publish.sh"]
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: { API_PORT: "3001" }
    depends_on: { coordinator-publisher: { condition: service_completed_successfully } }
    ports: ["3001:3001"]
    healthcheck: { test: [CMD, wget, -qO-, http://localhost:3001/health], interval: 5s, timeout: 5s, retries: 20 }
  agent-server:
    build: { context: ., dockerfile: services/agent-server/Dockerfile }
    environment:
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_ENDPOINT: "${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-study-abroad-v2-agents}"
    healthcheck: { test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok')"], interval: 10s, timeout: 5s, retries: 20 }
  worker:
    build: { context: ., dockerfile: backend/ai-worker/Dockerfile }
    environment: { AGENT_SERVER_URL: http://agent-server:2024, SPACETIME_URL: http://spacetimedb:3000, SPACETIME_DATABASE: study-abroad-coordinator, AGENT_USERNAME: "${AGENT_USERNAME:-study_abroad_agent}", AGENT_PASSWORD: "${AGENT_PASSWORD:-study-agent-dev}", AGENT_GRAPH_ID: agent }
    depends_on:
      spacetimedb: { condition: service_healthy, restart: true }
      agent-server: { condition: service_healthy }
      coordinator-publisher: { condition: service_completed_successfully }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_SPACETIME_URL: "${NEXT_PUBLIC_SPACETIME_URL:-}", NEXT_PUBLIC_SPACETIME_DATABASE: study-abroad-coordinator } }
    depends_on: { coordinator-publisher: { condition: service_completed_successfully }, spacetimedb: { condition: service_healthy } }
    ports: ["3010:3000"]
volumes:
  spacetimedb-advisor-data:
  spacetime-advisor-config:
