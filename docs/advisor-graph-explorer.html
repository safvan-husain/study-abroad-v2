<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Graph Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0c1117;
      --panel: #121920;
      --stroke: #243041;
      --muted: #8b9bb0;
      --text: #e8eef6;
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    code, pre, .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

    .canvas-viewport {
      cursor: grab;
      touch-action: none;
      background-color: #0c1117;
      background-image: radial-gradient(circle at 1px 1px, rgba(36, 48, 65, 0.9) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .canvas-viewport.dragging { cursor: grabbing; }

    .edge-path {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-opacity 0.2s, stroke-width 0.2s;
    }
    .edge-path.dim { stroke-opacity: 0.18; }
    .edge-path.active {
      stroke-width: 2.5;
      stroke-opacity: 1;
    }
    .edge-flow {
      stroke-dasharray: 6 10;
      animation: dash-flow 1.1s linear infinite;
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -16; }
    }

    .node-card {
      transition: opacity 0.15s ease;
      cursor: pointer;
    }
    .node-card.dim { opacity: 0.28; }

    .panel-scroll::-webkit-scrollbar { width: 8px; }
    .panel-scroll::-webkit-scrollbar-thumb {
      background: #2a3a4d;
      border-radius: 4px;
    }

    .tag {
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid;
    }

    pre.code-block {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 11.5px;
      line-height: 1.55;
      background: #0a0e14;
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: 12px 14px;
      color: #c5d4e4;
      max-height: 320px;
      overflow: auto;
    }

    .fade-in { animation: fadeIn 0.22s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes selectPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.35; }
    }
    .select-ring { animation: selectPulse 1.6s ease-in-out infinite; }
  </style>
</head>

          'Name says validate but it finalizes — no schema reject/retry here.',
        ],
        code: `def validate_discovery(state: AdvisorState) -> dict[str, Any]:
    return _finalize(state)`,
        lines: '441–442',
      },
      {
        id: 'END',
        label: 'END',
        kind: 'terminal',
        x: 700, y: 880, w: 100, h: 44,
        summary: 'Graph complete. Worker publishes advisor_result / messages to SpacetimeDB.',
        does: [
          'No node function — LangGraph terminal.',
          'Caller persists results; UI subscribes to committed updates.',
        ],
        stateReads: [],
        stateWrites: [],
        deterministic: [],
        pitfalls: [
          'Independent child work items (e.g. course_fit) are separate graph invokes, not blocked here.',
        ],
        code: `builder.add_edge("legacy_discover", END)
builder.add_edge("course_fit", END)
builder.add_edge("validate_guidance", END)
builder.add_edge("validate_discovery", END)
graph = builder.compile()`,
        lines: '528–546',
      },
    ];

    const EDGES = [
      { id: 'e0', from: 'START', to: 'legacy_discover', label: 'legacy', kind: 'cond' },
      { id: 'e1', from: 'START', to: 'course_fit', label: 'course_fit', kind: 'cond' },
      { id: 'e2', from: 'START', to: 'route_intent', label: 'specialist', kind: 'cond' },
      { id: 'e3', from: 'legacy_discover', to: 'END', label: '', kind: 'fixed' },
      { id: 'e4', from: 'course_fit', to: 'END', label: '', kind: 'fixed' },
      { id: 'e6', from: 'route_intent', to: 'guidance_agent', label: 'guidance', kind: 'cond' },
      { id: 'e7', from: 'route_intent', to: 'resolve_catalog_scope', label: 'discovery', kind: 'cond' },
      { id: 'e8', from: 'route_intent', to: 'clarification', label: 'clarify', kind: 'cond' },
      { id: 'e9', from: 'guidance_agent', to: 'validate_guidance', label: '', kind: 'fixed' },
      { id: 'e10', from: 'validate_guidance', to: 'END', label: '', kind: 'fixed' },
      { id: 'e11', from: 'clarification', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e12', from: 'resolve_catalog_scope', to: 'explain_course_types', label: 'area_overview', kind: 'cond' },
      { id: 'e13', from: 'resolve_catalog_scope', to: 'load_all_family_offerings', label: 'family_offerings', kind: 'cond' },
      { id: 'e14', from: 'resolve_catalog_scope', to: 'load_all_area_offerings', label: 'all_area_offerings', kind: 'cond' },
      { id: 'e15', from: 'resolve_catalog_scope', to: 'personalize_selection', label: 'personalize_selection', kind: 'cond' },
      { id: 'e16', from: 'resolve_catalog_scope', to: 'compare_offerings', label: 'compare_offerings', kind: 'cond' },
      { id: 'e17', from: 'resolve_catalog_scope', to: 'clarify_catalog_scope', label: 'clarify', kind: 'cond' },
      { id: 'e18', from: 'explain_course_types', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e19', from: 'load_all_family_offerings', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e20', from: 'load_all_area_offerings', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e21', from: 'personalize_selection', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e22', from: 'compare_offerings', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e23', from: 'clarify_catalog_scope', to: 'validate_discovery', label: '', kind: 'fixed' },
      { id: 'e24', from: 'validate_discovery', to: 'END', label: '', kind: 'fixed' },
    ];

    const WORLD = { w: 1760, h: 980 };
    const MIN_ZOOM = 0.25;
    const MAX_ZOOM = 2.5;

    function buildNodeMap() {
      const m = {};
      NODES.forEach((n) => { m[n.id] = n; });
      return m;
    }

    function relatedIds(selectedId) {
      if (!selectedId) return null;
      const set = new Set([selectedId]);
      EDGES.forEach((e) => {
        if (e.from === selectedId || e.to === selectedId) {
          set.add(e.from);
          set.add(e.to);
        }
      });
      return set;
    }

    function edgePath(from, to) {
      const x1 = from.x + from.w / 2;
      const y1 = from.y + from.h;
      const x2 = to.x + to.w / 2;
      const y2 = to.y;
      const dy = Math.max(40, (y2 - y1) * 0.45);
      return `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
    }

    function edgeLabelPos(from, to) {
      return {
        x: (from.x + from.w / 2 + to.x + to.w / 2) / 2,
        y: (from.y + from.h + to.y) / 2,
      };
    }

    function clampZoom(k) {
      return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, k));
    }

    function Section({ title, children }) {
      return (
        <div className="mb-4">
          <h3 className="text-[10px] uppercase tracking-wider text-[var(--muted)] font-semibold mb-2">{title}</h3>
          {children}
        </div>
      );
    }

    function Legend() {
      return (
        <div className="flex flex-wrap gap-2">
          {Object.entries(KIND).map(([k, v]) => (
            <span key={k} className="tag" style={{ color: v.color, borderColor: v.color + '66', background: v.fill }}>
              {v.label}
            </span>
          ))}
        </div>
      );
    }

    function DetailPanel({ node, onClose }) {
      if (!node) {
        return (
          <div className="h-full flex flex-col justify-center px-6 text-[var(--muted)]">
            <p className="text-lg text-[var(--text)] font-semibold mb-2">Advisor LangGraph</p>
            <p className="text-sm leading-relaxed mb-4">
              Pan with drag · Zoom with scroll / pinch / buttons · Click a node for summary, deterministic rules, state I/O, and source.
            </p>
            <p className="text-xs mono mb-3">Source: services/agent-server/agent_server/graph.py</p>
            <Legend />
          </div>
        );
      }
      const meta = KIND[node.kind];
      return (
        <div className="h-full panel-scroll overflow-y-auto fade-in px-5 py-4">
          <div className="flex items-start justify-between gap-3 mb-3">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="tag" style={{ color: meta.color, borderColor: meta.color + '66', background: meta.fill }}>
                  {meta.label}
                </span>
                <span className="text-xs mono text-[var(--muted)]">L{node.lines}</span>
              </div>
              <h2 className="text-xl font-semibold tracking-tight mono">{node.label}</h2>
            </div>
            <button
              type="button"
              onClick={onClose}
              className="text-[var(--muted)] hover:text-white text-sm px-2 py-1 rounded border border-[var(--stroke)]"
            >
              Close
            </button>
          </div>

          <p className="text-sm leading-relaxed text-[#c5d0dc] mb-4">{node.summary}</p>

          <Section title="What it does">
            <ul className="space-y-1.5">
              {node.does.map((d, i) => (
                <li key={i} className="text-sm text-[#c5d0dc] pl-3 border-l-2 border-[var(--stroke)]">{d}</li>
              ))}
            </ul>
          </Section>

          {node.deterministic.length > 0 && (
            <Section title="Deterministic logic / guards">
              <ul className="space-y-1.5">
                {node.deterministic.map((d, i) => (
                  <li key={i} className="text-sm mono text-[#9fd6bc] leading-snug">{d}</li>
                ))}
              </ul>
            </Section>
          )}

          <div className="grid grid-cols-1 gap-3 mb-4">
            <Section title="State reads">
              {node.stateReads.length ? (
                <div className="flex flex-wrap gap-1.5">
                  {node.stateReads.map((s) => (
                    <span key={s} className="mono text-xs px-2 py-0.5 rounded bg-[#1a2430] border border-[var(--stroke)] text-[#9eb6d0]">{s}</span>
                  ))}
                </div>
              ) : (
                <p className="text-xs text-[var(--muted)]">None</p>
              )}
            </Section>
            <Section title="State writes">
              {node.stateWrites.length ? (
                <div className="flex flex-wrap gap-1.5">
                  {node.stateWrites.map((s) => (
                    <span key={s} className="mono text-xs px-2 py-0.5 rounded bg-[#1a2430] border border-[#3d9cf055] text-[#8ec4f0]">{s}</span>
                  ))}
                </div>
              ) : (
                <p className="text-xs text-[var(--muted)]">None</p>
              )}
            </Section>
          </div>

          {node.pitfalls.length > 0 && (
            <Section title="Pitfalls / system notes">
              <ul className="space-y-1.5">
                {node.pitfalls.map((d, i) => (
                  <li key={i} className="text-sm text-[#e8c4a0] pl-3 border-l-2 border-[#e8a83855]">{d}</li>
                ))}
              </ul>
            </Section>
          )}

          <Section title="Exact code">
            <pre className="code-block">{node.code}</pre>
          </Section>
        </div>
      );
    }

    function GraphCanvas({ selectedId, onSelect, transform, setTransform, viewportRef }) {
      const nodes = useMemo(() => buildNodeMap(), []);
      const related = useMemo(() => relatedIds(selectedId), [selectedId]);
      const dragRef = useRef(null);
      const pointersRef = useRef(new Map());
      const pinchRef = useRef(null);
      const [dragging, setDragging] = useState(false);
      const transformRef = useRef(transform);
      transformRef.current = transform;

      const zoomAt = useCallback((clientX, clientY, nextK) => {
        const el = viewportRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const k = clampZoom(nextK);
        const mx = clientX - rect.left;
        const my = clientY - rect.top;
        setTransform((t) => {
          const worldX = (mx - t.x) / t.k;
          const worldY = (my - t.y) / t.k;
          return { k, x: mx - worldX * k, y: my - worldY * k };
        });
      }, [setTransform, viewportRef]);

      useEffect(() => {
        const el = viewportRef.current;
        if (!el) return;
        const onWheel = (e) => {
          e.preventDefault();
          const t = transformRef.current;
          const factor = Math.exp(-e.deltaY * 0.0015);
          zoomAt(e.clientX, e.clientY, t.k * factor);
        };
        el.addEventListener('wheel', onWheel, { passive: false });
        return () => el.removeEventListener('wheel', onWheel);
      }, [zoomAt, viewportRef]);

      const onPointerDown = (e) => {
        if (e.target.closest('[data-node]')) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointersRef.current.size === 1) {
          const t = transformRef.current;
          dragRef.current = { x: e.clientX, y: e.clientY, tx: t.x, ty: t.y };
          setDragging(true);
        } else if (pointersRef.current.size === 2) {
          const pts = [...pointersRef.current.values()];
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          pinchRef.current = { dist, k: transformRef.current.k };
          dragRef.current = null;
        }
      };

      const onPointerMove = (e) => {
        if (!pointersRef.current.has(e.pointerId)) return;
        pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointersRef.current.size === 2 && pinchRef.current) {
          const pts = [...pointersRef.current.values()];
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          const ratio = dist / (pinchRef.current.dist || 1);
          zoomAt(mid.x, mid.y, pinchRef.current.k * ratio);
          return;
        }
        if (dragRef.current) {
          const dx = e.clientX - dragRef.current.x;
          const dy = e.clientY - dragRef.current.y;
          setTransform({
            k: transformRef.current.k,
            x: dragRef.current.tx + dx,
            y: dragRef.current.ty + dy,
          });
        }
      };

      const onPointerUp = (e) => {
        pointersRef.current.delete(e.pointerId);
        if (pointersRef.current.size < 2) pinchRef.current = null;
        if (pointersRef.current.size === 0) {
          dragRef.current = null;
          setDragging(false);
        } else if (pointersRef.current.size === 1) {
          const pt = [...pointersRef.current.values()][0];
          const t = transformRef.current;
          dragRef.current = { x: pt.x, y: pt.y, tx: t.x, ty: t.y };
        }
      };

      return (
        <div
          ref={viewportRef}
          className={`canvas-viewport absolute inset-0 overflow-hidden ${dragging ? 'dragging' : ''}`}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerUp}
          onDoubleClick={(e) => {
            if (e.target.closest('[data-node]')) return;
            onSelect(null);
          }}
        >
          <svg width="100%" height="100%" className="block">
            <g transform={`translate(${transform.x}, ${transform.y}) scale(${transform.k})`}>
              {EDGES.map((edge) => {
                const from = nodes[edge.from];
                const to = nodes[edge.to];
                const active = related
                  ? related.has(edge.from) && related.has(edge.to) && (edge.from === selectedId || edge.to === selectedId)
                  : false;
                const dim = related && !active;
                const color = edge.kind === 'cond' ? '#e8a838' : '#4a6280';
                const lp = edge.label ? edgeLabelPos(from, to) : null;
                const labelW = edge.label ? edge.label.length * 6.8 + 12 : 0;
                return (
                  <g key={edge.id}>
                    <path
                      d={edgePath(from, to)}
                      className={`edge-path ${active ? 'active edge-flow' : ''} ${dim ? 'dim' : ''}`}
                      stroke={color}
                    />
                    {edge.label && (
                      <g transform={`translate(${lp.x}, ${lp.y})`} opacity={dim ? 0.25 : 1}>
                        <rect x={-labelW / 2} y={-9} width={labelW} height={18} rx={4} fill="#0c1117" stroke="#243041" />
                        <text textAnchor="middle" y={4} className="mono" fontSize="10" fill={edge.kind === 'cond' ? '#e8c878' : '#8b9bb0'}>
                          {edge.label}
                        </text>
                      </g>
                    )}
                  </g>
                );
              })}

              {NODES.map((n) => {
                const meta = KIND[n.kind];
                const selected = selectedId === n.id;
                const dim = related && !related.has(n.id);
                return (
                  <g
                    key={n.id}
                    data-node="true"
                    className={`node-card ${dim ? 'dim' : ''}`}
                    transform={`translate(${n.x}, ${n.y})`}
                    onClick={(e) => {
                      e.stopPropagation();
                      onSelect(n.id === selectedId ? null : n.id);
                    }}
                  >
                    {selected && (
                      <rect
                        className="select-ring"
                        x={-5} y={-5} width={n.w + 10} height={n.h + 10} rx={10}
                        fill="none" stroke={meta.color} strokeWidth="1.5"
                      />
                    )}
                    <rect
                      width={n.w} height={n.h} rx={8}
                      fill={meta.fill}
                      stroke={selected ? meta.color : meta.color + '99'}
                      strokeWidth={selected ? 2 : 1.25}
                    />
                    <rect x={0} y={0} width={4} height={n.h} rx={2} fill={meta.color} />
                    <text
                      x={n.w / 2}
                      y={n.h / 2 + 1}
                      textAnchor="middle"
                      dominantBaseline="middle"
                      className="mono"
                      fontSize={n.label.length > 22 ? 10 : 11.5}
                      fontWeight="500"
                      fill="#e8eef6"
                    >
                      {n.label}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>
        </div>
      );
    }

    function ZoomControls({ transform, setTransform, viewportRef }) {
      const zoomCenter = (factor) => {
        const el = viewportRef.current;
        if (!el) {
          setTransform((t) => ({ ...t, k: clampZoom(t.k * factor) }));
          return;
        }
        const rect = el.getBoundingClientRect();
        const mx = rect.width / 2;
        const my = rect.height / 2;
        setTransform((t) => {
          const k = clampZoom(t.k * factor);
          const worldX = (mx - t.x) / t.k;
          const worldY = (my - t.y) / t.k;
          return { k, x: mx - worldX * k, y: my - worldY * k };
        });
      };

      const fit = () => {
        const el = viewportRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const pad = 48;
        const k = Math.min((rect.width - pad * 2) / WORLD.w, (rect.height - pad * 2) / WORLD.h, 1);
        setTransform({
          k: clampZoom(k),
          x: (rect.width - WORLD.w * k) / 2,
          y: (rect.height - WORLD.h * k) / 2,
        });
      };

      return (
        <div className="absolute bottom-4 left-4 z-10 flex items-center gap-1 bg-[var(--panel)] border border-[var(--stroke)] rounded-lg p-1 shadow-none">
          <button type="button" className="w-9 h-9 rounded hover:bg-[#1c2733] mono text-lg" onClick={() => zoomCenter(1 / 1.2)} title="Zoom out">−</button>
          <span className="mono text-xs w-12 text-center text-[var(--muted)]">{Math.round(transform.k * 100)}%</span>
          <button type="button" className="w-9 h-9 rounded hover:bg-[#1c2733] mono text-lg" onClick={() => zoomCenter(1.2)} title="Zoom in">+</button>
          <div className="w-px h-6 bg-[var(--stroke)] mx-1" />
          <button type="button" className="px-3 h-9 rounded hover:bg-[#1c2733] text-xs" onClick={fit}>Fit</button>
          <button
            type="button"
            className="px-3 h-9 rounded hover:bg-[#1c2733] text-xs"
            onClick={() => setTransform({ k: 1, x: 40, y: 40 })}
          >
            100%
          </button>
        </div>
      );
    }

    function App() {
      const [selectedId, setSelectedId] = useState(null);
      const [transform, setTransform] = useState({ k: 0.72, x: 24, y: 24 });
      const [panelOpen, setPanelOpen] = useState(true);
      const viewportRef = useRef(null);
      const selected = NODES.find((n) => n.id === selectedId) || null;

      useEffect(() => {
        const fit = () => {
          const el = viewportRef.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          if (rect.width < 10 || rect.height < 10) return;
          const pad = 40;
          const k = Math.min((rect.width - pad * 2) / WORLD.w, (rect.height - pad * 2) / WORLD.h, 0.95);
          setTransform({
            k: clampZoom(k),
            x: (rect.width - WORLD.w * k) / 2,
            y: Math.max(16, (rect.height - WORLD.h * k) / 2),
          });
        };
        const t = setTimeout(fit, 60);
        window.addEventListener('resize', fit);
        return () => {
          clearTimeout(t);
          window.removeEventListener('resize', fit);
        };
      }, []);

      return (
        <div className="h-full flex flex-col">
          <header className="shrink-0 h-12 px-4 border-b border-[var(--stroke)] bg-[var(--panel)] flex items-center justify-between gap-4">
            <div className="flex items-center gap-3 min-w-0">
              <span className="font-semibold tracking-tight">Advisor Graph Explorer</span>
              <span className="hidden sm:inline text-xs text-[var(--muted)] mono truncate">
                agent_server/graph.py · StateGraph(AdvisorState)
              </span>
            </div>
            <button
              type="button"
              className="text-xs px-3 py-1.5 rounded border border-[var(--stroke)] hover:bg-[#1c2733]"
              onClick={() => setPanelOpen((v) => !v)}
            >
              {panelOpen ? 'Hide panel' : 'Show panel'}
            </button>
          </header>

          <div className="flex-1 flex min-h-0">
            <div className="relative flex-1 min-w-0">
              <GraphCanvas
                selectedId={selectedId}
                onSelect={(id) => {
                  setSelectedId(id);
                  if (id) setPanelOpen(true);
                }}
                transform={transform}
                setTransform={setTransform}
                viewportRef={viewportRef}
              />
              <ZoomControls transform={transform} setTransform={setTransform} viewportRef={viewportRef} />
              <div className="absolute top-3 left-3 text-[10px] text-[var(--muted)] bg-[var(--panel)]/90 border border-[var(--stroke)] rounded px-2 py-1 pointer-events-none">
                Scroll zoom · Drag pan · Pinch · Double-click empty to deselect
              </div>
            </div>

            {panelOpen && (
              <aside className="w-full sm:w-[400px] lg:w-[440px] shrink-0 border-l border-[var(--stroke)] bg-[var(--panel)]">
                <DetailPanel node={selected} onClose={() => setSelectedId(null)} />
              </aside>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
